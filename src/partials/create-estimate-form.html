<div class="mx-auto max-w-(--breakpoint-2xl)">
  <div class="grid grid-cols-12 gap-4 md:gap-6">
    <div class="col-span-12">
      <div class="flex flex-col flex-1 w-full">
        <div class="flex flex-col justify-center flex-1 w-full">
          <!-- Container wrapper -->
          <div
            id="editableWrap"
            class="inline-flex relative items-baseline gap-2"
          >
            <!-- Display Text -->
            <h4
              id="editableText"
              class="mb-3 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-sm transition-opacity duration-150"
            >
              New Estimate
            </h4>

            <!-- Input Field (keeps same vertical spacing with mb-3) -->
            <input
              id="editInput"
              type="text"
              class="hidden mb-3 text-3xl dark:text-white font-bold text-left !text-left text-start indent-0 border-0 shadow-none focus:ring-0 focus:outline-none self-start"
            />

            <!-- Edit Button -->
            <button
              id="editBtn"
              title="Edit"
              class="cursor-pointer p-1"
              aria-label="Edit title"
            >
              <!-- svg -->
              <svg
                width="18"
                height="18"
                viewBox="0 0 18 18"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9 4.58605L1 12.5861V16.5861L5 16.586L13 8.58604M9 4.58605L11.8686 1.7174L11.8704 1.7157C12.2652 1.32082 12.463 1.12303 12.691 1.04894C12.8919 0.983686 13.1082 0.983686 13.3091 1.04894C13.5369 1.12297 13.7345 1.32054 14.1288 1.71486L15.8686 3.45466C16.2646 3.85067 16.4627 4.04878 16.5369 4.2771C16.6022 4.47795 16.6021 4.69429 16.5369 4.89513C16.4628 5.1233 16.265 5.3211 15.8695 5.71655L15.8686 5.7174L13 8.58604M9 4.58605L13 8.58604"
                  stroke="#8E8E93"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="-mx-2.5 flex flex-wrap gap-y-5">
          <div class="w-full px-2.5 xl:w-2/3">
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Select Client
            </label>
            <div class="flex flex-1 gap-3">
              <div class="relative flex-1" data-hs-combo-box="">
                <div class="relative">
                  <input
                    class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                    type="text"
                    role="combobox"
                    aria-expanded="false"
                    value=""
                    data-hs-combo-box-input=""
                  />
                  <div
                    class="hidden hs-combo-box-active:flex absolute inset-y-0 end-8 items-center z-20"
                  >
                    <button
                      type="button"
                      class="inline-flex shrink-0 justify-center items-center size-6 rounded-full text-gray-500 hover:text-blue-600 focus:outline-hidden focus:text-blue-600 dark:text-neutral-500 dark:hover:text-blue-500 dark:focus:text-blue-500"
                      aria-label="Close"
                      data-hs-combo-box-close=""
                    >
                      <span class="sr-only">Close</span>
                      <svg
                        class="shrink-0 size-4"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="m15 9-6 6"></path>
                        <path d="m9 9 6 6"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
              <button
                class="inline-flex items-center gap-2 px-3 py-3 text-sm font-medium text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600"
                command="show-modal"
                commandfor="dialog"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 18 18"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M4.37451 9H8.74914M8.74914 9H13.1238M8.74914 9V13.5M8.74914 9V4.5"
                    stroke="#fff"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>

                Add New Client
              </button>

              <el-dialog>
                <dialog
                  id="dialog"
                  aria-labelledby="dialog-title"
                  class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent"
                >
                  <el-dialog-backdrop
                    class="fixed inset-0 bg-gray-500/75 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"
                  ></el-dialog-backdrop>

                  <div
                    tabindex="0"
                    class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0"
                  >
                    <el-dialog-panel
                      class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:max-w-xl data-closed:sm:translate-y-0 data-closed:sm:scale-95"
                    >
                      <div
                        class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4 dark:bg-slate-800"
                      >
                        <div class="sm:flex sm:items-start">
                          <div class="col-span-12">
                            <div class="flex flex-col flex-1 w-full">
                              <div
                                class="flex flex-col justify-center flex-1 w-full"
                              >
                                <div class="">
                                  <h4
                                    class="font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-sm"
                                  >
                                    Add New Client
                                  </h4>
                                </div>
                                <div>
                                  <div class="relative py-3 sm:py-5">
                                    <div
                                      class="absolute inset-0 flex items-center"
                                    >
                                      <div
                                        class="w-full border-t border-gray-200 dark:border-gray-800"
                                      ></div>
                                    </div>
                                  </div>
                                  <form>
                                    <div class="space-y-5">
                                      <div
                                        class="grid grid-cols-1 gap-5 sm:grid-cols-2"
                                      >
                                        <!-- First Name -->
                                        <div class="sm:col-span-1">
                                          <label
                                            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Client Name<span
                                              class="text-error-500"
                                              >*</span
                                            >
                                          </label>
                                          <input
                                            type="text"
                                            id="fname"
                                            name="fname"
                                            placeholder="Enter your first name"
                                            class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                                          />
                                        </div>
                                        <!-- Last Name -->
                                        <div class="sm:col-span-1">
                                          <label
                                            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Client Type
                                          </label>
                                          <div
                                            x-data="{ isOptionSelected: false }"
                                            class="relative z-20 bg-transparent"
                                          >
                                            <select
                                              class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:ring-brand-500/10 dark:focus:border-brand-800 h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30"
                                              :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
                                              @change="isOptionSelected = true"
                                            >
                                              <option
                                                value=""
                                                class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                                              >
                                                Select Option
                                              </option>
                                              <option
                                                value=""
                                                class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                                              >
                                                Marketing
                                              </option>
                                              <option
                                                value=""
                                                class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                                              >
                                                Template
                                              </option>
                                              <option
                                                value=""
                                                class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                                              >
                                                Development
                                              </option>
                                            </select>
                                            <span
                                              class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400"
                                            >
                                              <svg
                                                class="stroke-current"
                                                width="20"
                                                height="20"
                                                viewBox="0 0 20 20"
                                                fill="none"
                                                xmlns="http://www.w3.org/2000/svg"
                                              >
                                                <path
                                                  d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
                                                  stroke=""
                                                  stroke-width="1.5"
                                                  stroke-linecap="round"
                                                  stroke-linejoin="round"
                                                />
                                              </svg>
                                            </span>
                                          </div>
                                        </div>
                                      </div>
                                      <!-- Contact -->
                                      <div
                                        class="grid grid-cols-1 gap-5 sm:grid-cols-2"
                                      >
                                        <!-- Primary Contact -->
                                        <div class="sm:col-span-1">
                                          <label
                                            class="text-[#316ff6] mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Phone
                                            <span class="text-error-500"
                                              >*</span
                                            >
                                          </label>
                                          <input
                                            type="text"
                                            id="fname"
                                            name="fname"
                                            placeholder="Enter your Phone Number"
                                            class="dark:bg-dark-900 h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                                          />
                                        </div>
                                        <!-- Secondary Contact -->
                                        <div class="sm:col-span-1">
                                          <label
                                            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Email
                                          </label>
                                          <div class="relative">
                                            <span
                                              class="absolute top-1/2 left-0 -translate-y-1/2 border-r border-gray-200 px-3.5 p-3 text-gray-500 dark:border-gray-800 dark:text-gray-400"
                                            >
                                              <svg
                                                width="20"
                                                height="20"
                                                viewBox="0 0 20 20"
                                                fill="none"
                                                xmlns="http://www.w3.org/2000/svg"
                                              >
                                                <path
                                                  fill-rule="evenodd"
                                                  clip-rule="evenodd"
                                                  d="M3.04175 7.06206V14.375C3.04175 14.6511 3.26561 14.875 3.54175 14.875H16.4584C16.7346 14.875 16.9584 14.6511 16.9584 14.375V7.06245L11.1443 11.1168C10.457 11.5961 9.54373 11.5961 8.85638 11.1168L3.04175 7.06206ZM16.9584 5.19262C16.9584 5.19341 16.9584 5.1942 16.9584 5.19498V5.20026C16.9572 5.22216 16.946 5.24239 16.9279 5.25501L10.2864 9.88638C10.1145 10.0062 9.8862 10.0062 9.71437 9.88638L3.07255 5.25485C3.05342 5.24151 3.04202 5.21967 3.04202 5.19636C3.042 5.15695 3.07394 5.125 3.11335 5.125H16.8871C16.9253 5.125 16.9564 5.15494 16.9584 5.19262ZM18.4584 5.21428V14.375C18.4584 15.4796 17.563 16.375 16.4584 16.375H3.54175C2.43718 16.375 1.54175 15.4796 1.54175 14.375V5.19498C1.54175 5.1852 1.54194 5.17546 1.54231 5.16577C1.55858 4.31209 2.25571 3.625 3.11335 3.625H16.8871C17.7549 3.625 18.4584 4.32843 18.4585 5.19622C18.4585 5.20225 18.4585 5.20826 18.4584 5.21428Z"
                                                  fill="#667085"
                                                />
                                              </svg>
                                            </span>
                                            <input
                                              type="text"
                                              placeholder="info@gmail.com"
                                              class="w-full h-11 rounded-lg border border-gray-300 bg-transparent text-sm text-gray-800 placeholder:text-gray-400 pr-4 py-2.5 focus:border-brand-300 focus:ring-brand-500/10 focus:ring-3 focus:outline-hidden dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 pl-16"
                                            />
                                          </div>
                                        </div>
                                      </div>

                                      <div
                                        class="grid grid-cols-1 gap-5 sm:grid-cols-2"
                                      >
                                        <!-- Phone -->
                                        <div class="sm:col-span-1">
                                          <!-- Elements -->
                                          <label
                                            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Address
                                          </label>
                                          <textarea
                                            placeholder="Address..."
                                            type="text"
                                            rows="3"
                                            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:shadow-focus-ring dark:focus:border-brand-800 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-0 focus:outline-hidden disabled:border-gray-100 disabled:bg-gray-50 disabled:placeholder:text-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:disabled:border-gray-800 dark:disabled:bg-white/[0.03] dark:disabled:placeholder:text-white/15"
                                          ></textarea>
                                        </div>
                                        <!-- Secondary Contact -->
                                        <div class="sm:col-span-1">
                                          <!-- Elements -->
                                          <div class="flex gap-4">
                                            <label
                                              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                            >
                                              Billing Address
                                            </label>
                                            <div
                                              x-data="{ checkboxToggle: false }"
                                            >
                                              <label
                                                for="checkboxLabelOne"
                                                class="flex cursor-pointer items-center text-sm font-medium text-gray-700 select-none dark:text-gray-400"
                                              >
                                                <div class="relative">
                                                  <input
                                                    type="checkbox"
                                                    id="checkboxLabelOne"
                                                    class="sr-only"
                                                    @change="checkboxToggle = !checkboxToggle"
                                                  />
                                                  <div
                                                    :class="checkboxToggle ? 'border-brand-500 bg-brand-500' : 'bg-transparent border-gray-300 dark:border-gray-700'"
                                                    class="f hover:border-brand-500 dark:hover:border-brand-500 mr-3 flex h-5 w-5 items-center justify-center rounded-md border-[1.25px]"
                                                  >
                                                    <span
                                                      :class="checkboxToggle ? '' : 'opacity-0'"
                                                    >
                                                      <svg
                                                        width="14"
                                                        height="14"
                                                        viewBox="0 0 14 14"
                                                        fill="none"
                                                        xmlns="http://www.w3.org/2000/svg"
                                                      >
                                                        <path
                                                          d="M11.6666 3.5L5.24992 9.91667L2.33325 7"
                                                          stroke="white"
                                                          stroke-width="1.94437"
                                                          stroke-linecap="round"
                                                          stroke-linejoin="round"
                                                        />
                                                      </svg>
                                                    </span>
                                                  </div>
                                                </div>
                                                Same as Address
                                              </label>
                                            </div>
                                          </div>
                                          <textarea
                                            placeholder="Billing Address..."
                                            type="text"
                                            rows="3"
                                            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:shadow-focus-ring dark:focus:border-brand-800 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-0 focus:outline-hidden disabled:border-gray-100 disabled:bg-gray-50 disabled:placeholder:text-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:disabled:border-gray-800 dark:disabled:bg-white/[0.03] dark:disabled:placeholder:text-white/15"
                                          ></textarea>
                                        </div>
                                      </div>

                                      <div class="grid grid-cols-1">
                                        <div class="sm:col-span-1">
                                          <!-- Elements -->
                                          <label
                                            class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
                                          >
                                            Note
                                          </label>
                                          <textarea
                                            placeholder="Enter Note..."
                                            type="text"
                                            rows="3"
                                            class="dark:bg-dark-900 shadow-theme-xs focus:border-brand-300 focus:shadow-focus-ring dark:focus:border-brand-800 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 focus:ring-0 focus:outline-hidden disabled:border-gray-100 disabled:bg-gray-50 disabled:placeholder:text-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:disabled:border-gray-800 dark:disabled:bg-white/[0.03] dark:disabled:placeholder:text-white/15"
                                          ></textarea>
                                        </div>
                                      </div>
                                    </div>
                                  </form>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div
                        class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6 gap-3 dark:bg-slate-800"
                      >
                        <button
                          class="inline-flex items-center gap-2 px-4 py-3 text-sm font-medium text-white transition rounded-lg bg-brand-500 shadow-theme-xs hover:bg-brand-600"
                        >
                          Create Client
                        </button>

                        <button
                          class="inline-flex items-center gap-2 rounded-lg bg-white px-4 py-3 text-sm font-medium text-gray-700 shadow-theme-xs ring-1 ring-inset ring-gray-300 transition hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-400 dark:ring-gray-700 dark:hover:bg-white/[0.03]"
                          type="button"
                          command="close"
                          commandfor="dialog"
                        >
                          Cancel
                        </button>
                      </div>
                    </el-dialog-panel>
                  </div>
                </dialog>
              </el-dialog>
            </div>
          </div>

          <div class="w-full px-2.5 xl:w-1/3">
            <label
              class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Date
            </label>
            <div class="relative">
              <input
                class="datepicker w-full rounded-lg border border-gray-300 bg-white py-2.5 px-3 text-theme-sm font-medium text-gray-700 shadow-theme-xs focus:outline-hidden focus:ring-0 focus-visible:outline-hidden dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400"
                placeholder="Select dates"
                data-class="flatpickr-left"
              />
              <div
                class="absolute inset-0 left-auto flex items-center pointer-events-none right-4"
              >
                <svg
                  class="fill-gray-700 dark:fill-gray-400"
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M6.66683 1.54199C7.08104 1.54199 7.41683 1.87778 7.41683 2.29199V3.00033H12.5835V2.29199C12.5835 1.87778 12.9193 1.54199 13.3335 1.54199C13.7477 1.54199 14.0835 1.87778 14.0835 2.29199V3.00033L15.4168 3.00033C16.5214 3.00033 17.4168 3.89576 17.4168 5.00033V7.50033V15.8337C17.4168 16.9382 16.5214 17.8337 15.4168 17.8337H4.5835C3.47893 17.8337 2.5835 16.9382 2.5835 15.8337V7.50033V5.00033C2.5835 3.89576 3.47893 3.00033 4.5835 3.00033L5.91683 3.00033V2.29199C5.91683 1.87778 6.25262 1.54199 6.66683 1.54199ZM6.66683 4.50033H4.5835C4.30735 4.50033 4.0835 4.72418 4.0835 5.00033V6.75033H15.9168V5.00033C15.9168 4.72418 15.693 4.50033 15.4168 4.50033H13.3335H6.66683ZM15.9168 8.25033H4.0835V15.8337C4.0835 16.1098 4.30735 16.3337 4.5835 16.3337H15.4168C15.693 16.3337 15.9168 16.1098 15.9168 15.8337V8.25033Z"
                    fill=""
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="relative mt-3">
          <div class="absolute inset-0 flex items-center">
            <div
              class="w-full border-t border-gray-200 dark:border-gray-800"
            ></div>
          </div>
        </div>

        <div
          class="bg-gray-100 dark:bg-slate-800 dark:text-white text-sm font-semibold text-right px-4 py-2"
        >
          Stage Total : <span>98,99,990</span>
        </div>

        <div
          class="rounded-lg border dark:border-gray-700 border-gray-300 mt-3 p-3"
        >
          <div class="parent-box flex-1 flex flex-col gap-3 relative">
            <div id="stages-wrapper" class="flex flex-col gap-3"></div>

            <!-- Stage Template -->
            <template id="stage-template">
              <div
                class="stage flex-1 flex flex-col"
                data-stage-index="__i__"
                data-default="false"
              >
                <div class="p-r-box flex-1 flex gap-2">
                  <div class="flex flex-1 flex-col gap-3">
                    <div
                      class="rounded-lg border flex dark:bg-slate-800 dark:text-white dark:border-gray-700 border-gray-300 p-3 bg-[#F1F7FF]"
                    >
                      <div class="flex flex-col self-center">
                        <span class="cursor-pointer" title="Up">
                          <svg
                            width="18"
                            height="18"
                            viewBox="0 0 27 25"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M13.5 17.7084V7.29169M13.5 7.29169L9 11.4584M13.5 7.29169L18 11.4584"
                              stroke="#465FFF"
                              stroke-width="2"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                            ></path>
                          </svg>
                        </span>
                        <span class="cursor-pointer" title="Down">
                          <svg
                            width="18"
                            height="18"
                            viewBox="0 0 27 26"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M13.5 7.58331V18.4166M13.5 18.4166L18 14.0833M13.5 18.4166L9 14.0833"
                              stroke="#AEAEB2"

<script>
  (function () {
    const wrap = document.getElementById("editableWrap");
    const editableText = document.getElementById("editableText");
    const editInput = document.getElementById("editInput");
    const editBtn = document.getElementById("editBtn");

    function openEditor() {
      // populate input
      editInput.value = editableText.textContent.trim();

      // show input / hide text + button
      editableText.classList.add("hidden");
      editInput.classList.remove("hidden");
      editBtn.classList.add("hidden");

      // focus and place caret at end
      editInput.focus();
      editInput.setSelectionRange(
        editInput.value.length,
        editInput.value.length
      );
    }

    function closeEditor(save = true) {
      const newValue = editInput.value.trim();

      if (save && newValue !== "") {
        editableText.textContent = newValue;
      } else {
        // revert input value to original text if empty or not saving
        editInput.value = editableText.textContent;
      }

      // hide input / show text + button
      editInput.classList.add("hidden");
      editableText.classList.remove("hidden");
      editBtn.classList.remove("hidden");
    }

    // click edit button — open editor
    editBtn.addEventListener("click", (e) => {
      e.stopPropagation(); // prevent bubbling to document click
      openEditor();
    });

    // Enter = save
    editInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        closeEditor(true);
      } else if (e.key === "Escape") {
        // Esc = cancel (revert)
        closeEditor(false);
      }
    });

    // blur = save (when the input loses focus)
    editInput.addEventListener("blur", () => {
      // small timeout to allow click on buttons inside the wrap (if any)
      setTimeout(() => {
        if (!document.activeElement || document.activeElement !== editInput) {
          closeEditor(true);
        }
      }, 0);
    });

    // click outside the wrapper => save
    document.addEventListener("click", (e) => {
      // if editor is open and click target is outside the wrapper, save
      const editorOpen = !editInput.classList.contains("hidden");
      if (editorOpen && !wrap.contains(e.target)) {
        closeEditor(true);
      }
    });

    // Optional: keyboard accessibility — Enter on editBtn
    editBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openEditor();
      }
    });
  })();
</script>
<script>
  /*
  Optimized + Shortened dynamic Stage→Category→Listing script
  Requirements preserved:
  - Default 1 Stage → 1 Category → 1 Listing on load
  - add/remove stage/category/listing
  - auto-add 1 listing for new category; new stage adds 1 category+1 listing
  - auto-remove empty category/stage (except defaults)
  - Laravel-friendly names: stages[i][name], stages[i][categories][j][name], stages[i][categories][j][listings][k][field]
  - Detects inputs by placeholder/tag; SELECT is treated as unit
*/

  (() => {
    let tplIdCounter = 0;
    const wrapperSel = "#stages-wrapper";

    const fldOrder = [
      "name",
      "description",
      "unit",
      "quantity",
      "rate",
      "amount",
    ];
    const queryAll = (el) =>
      Array.from(el.querySelectorAll("input,textarea,select"));

    const detectField = (el) => {
      const tag = el.tagName.toLowerCase();
      if (tag === "select") return "unit";
      const ph = (el.placeholder || "").toLowerCase();
      if (ph.includes("name") || ph.includes("listing")) return "name";
      if (ph.includes("description") || ph.includes("desc"))
        return "description";
      if (ph.includes("unit")) return "unit";
      if (ph.includes("qty") || ph.includes("quantity")) return "quantity";
      if (ph.includes("rate")) return "rate";
      if (ph.includes("amount") || ph.includes("amt")) return "amount";
      return "value";
    };

    const findStageInput = (s) => {
      const cands = queryAll(s);
      return (
        cands.find(
          (i) =>
            (i.placeholder || "").toLowerCase().includes("enter stage") ||
            (i.placeholder || "").toLowerCase().includes("stage")
        ) ||
        cands[0] ||
        null
      );
    };
    const findCategoryInput = (c) => {
      const cands = queryAll(c);
      return (
        cands.find(
          (i) =>
            (i.placeholder || "").toLowerCase().includes("enter category") ||
            (i.placeholder || "").toLowerCase().includes("category")
        ) ||
        cands[0] ||
        null
      );
    };

    function reindexAll() {
      const stages = document.querySelectorAll(`${wrapperSel} .stage`);
      stages.forEach((stage, si) => {
        stage.dataset.index = si;
        const sInp = findStageInput(stage);
        if (sInp) sInp.name = `stages[${si}][name]`;

        const categories = stage.querySelectorAll(".category");
        categories.forEach((cat, cj) => {
          cat.dataset.index = cj;
          const cInp = findCategoryInput(cat);
          if (cInp) cInp.name = `stages[${si}][categories][${cj}][name]`;

          const listings = cat.querySelectorAll(".listing");
          listings.forEach((list, lk) => {
            list.dataset.index = lk;
            // collect and map listing inputs
            const cand = queryAll(list);
            const map = {};
            cand.forEach((el) => {
              const key = detectField(el);
              if (!map[key]) map[key] = el;
            });
            // assign ordered fields
            fldOrder.forEach((key, idx) => {
              if (map[key])
                map[
                  key
                ].name = `stages[${si}][categories][${cj}][listings][${lk}][${key}]`;
            });
            // leftovers
            cand
              .filter((e) => !Object.values(map).includes(e))
              .forEach(
                (el, r) =>
                  (el.name = `stages[${si}][categories][${cj}][listings][${lk}][extra_${r}]`)
              );
          });
        });
      });
    }

    function protectDefaults(stage) {
      stage.dataset.default = "true";
      const setDisabled = (elSel) => {
        const btn = stage.querySelector(elSel);
        if (btn) {
          btn.disabled = true;
          btn.style.opacity = "0.35";
          btn.style.cursor = "not-allowed";
        }
      };
      setDisabled(".remove-stage");
      const firstCat = stage.querySelector(".category");
      if (firstCat) {
        firstCat.dataset.default = "true";
        const rmCat = firstCat.querySelector(".remove-category");
        if (rmCat) {
          rmCat.disabled = true;
          rmCat.style.opacity = "0.35";
          rmCat.style.cursor = "not-allowed";
        }
        const firstList = firstCat.querySelector(".listing");
        if (firstList) {
          const rmList = firstList.querySelector(".remove-listing");
          if (rmList) {
            rmList.disabled = true;
            rmList.style.opacity = "0.35";
            rmList.style.cursor = "not-allowed";
          }
        }
      }
    }

    function tplHTML(id) {
      const t = document.getElementById(id);
      return t ? t.innerHTML.replace(/__i__/g, tplIdCounter++) : "";
    }

    function addStage(isDefault = false) {
      const html = tplHTML("stage-template");
      if (!html) {
        console.error("stage-template missing");
        return null;
      }
      document.querySelector(wrapperSel).insertAdjacentHTML("beforeend", html);
      const st = document.querySelector(`${wrapperSel} .stage:last-child`);
      addCategory(st, isDefault); // adds one category + one listing
      if (isDefault) protectDefaults(st);
      reindexAll();
      return st;
    }

    function addCategory(stageOrBtn, isDefault = false) {
      const stage =
        stageOrBtn.classList && stageOrBtn.classList.contains("stage")
          ? stageOrBtn
          : stageOrBtn.closest(".stage");
      if (!stage) {
        console.error("parent stage not found");
        return null;
      }
      const html = tplHTML("category-template");
      if (!html) {
        console.error("category-template missing");
        return null;
      }
      stage.querySelector(".categories").insertAdjacentHTML("beforeend", html);
      const cat = stage.querySelector(".categories .category:last-child");
      addListing(cat, isDefault);
      if (isDefault) protectDefaults(stage);
      reindexAll();
      return cat;
    }

    function addListing(categoryOrBtn, isDefault = false) {
      const cat =
        categoryOrBtn.classList && categoryOrBtn.classList.contains("category")
          ? categoryOrBtn
          : categoryOrBtn.closest(".category");
      if (!cat) {
        console.error("category not found");
        return null;
      }
      const html = tplHTML("listing-template");
      if (!html) {
        console.error("listing-template missing");
        return null;
      }
      cat.querySelector(".listings").insertAdjacentHTML("beforeend", html);
      const list = cat.querySelector(".listings .listing:last-child");
      if (isDefault) {
        const st = cat.closest(".stage");
        if (st) protectDefaults(st);
      }
      reindexAll();
      return list;
    }

    function cleanupAfterListingRemoval(cat) {
      if (!cat) return reindexAll();
      const lists = cat.querySelectorAll(".listing");
      if (lists.length === 0 && cat.dataset.default !== "true") {
        const parentStage = cat.closest(".stage");
        cat.remove();
        if (
          parentStage &&
          parentStage.querySelectorAll(".category").length === 0 &&
          parentStage.dataset.default !== "true"
        )
          parentStage.remove();
      }
      reindexAll();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const wrap = document.getElementById(wrapperSel.replace("#", ""));
      if (!wrap) {
        console.error("stages-wrapper missing");
        return;
      }
      if (wrap.querySelectorAll(".stage").length === 0) {
        const s = addStage(true);
        if (s) protectDefaults(s);
      } else {
        const first = wrap.querySelector(".stage");
        if (first) protectDefaults(first);
        reindexAll();
      }
    });

    document.addEventListener("click", (e) => {
      const t = e.target;
      if (t.closest(".add-stage") || t.id === "add-stage-btn") {
        addStage(false);
        return;
      }
      if (t.closest(".remove-stage")) {
        const st = t.closest(".stage");
        if (st && st.dataset.default !== "true") {
          st.remove();
          reindexAll();
        }
        return;
      }
      if (t.closest(".add-category")) {
        addCategory(t, false);
        return;
      }
      if (t.closest(".remove-category")) {
        const cat = t.closest(".category");
        if (cat && cat.dataset.default !== "true") {
          const ps = cat.closest(".stage");
          cat.remove();
          if (
            ps &&
            ps.querySelectorAll(".category").length === 0 &&
            ps.dataset.default !== "true"
          )
            ps.remove();
          else reindexAll();
        }
        return;
      }
      if (t.closest(".add-listing")) {
        addListing(t, false);
        return;
      }
      if (t.closest(".remove-listing")) {
        const li = t.closest(".listing");
        if (li && li.dataset.default !== "true") {
          const c = li.closest(".category");
          li.remove();
          cleanupAfterListingRemoval(c);
        }
        return;
      }
    });

    window.__stages_dynamic = { reindexAll, addStage, addCategory, addListing };
  })();
</script>

<script>
  // =============================
  //   UP & DOWN Movement Script
  //   (with fixed arrow-color logic)
  // =============================

  document.addEventListener("click", function (e) {
    const btn = e.target.closest("span[title='Up'], span[title='Down']");
    if (!btn) return;

    const isUp = btn.getAttribute("title") === "Up";
    const isDown = !isUp;

    const wrapper = document.querySelector("#stages-wrapper");

    // Helper: find nearest wrapper by class name
    function findParent(el, cls) {
      return el.closest("." + cls);
    }

    // 1) LISTING movement
    const listing = findParent(btn, "listing");
    if (listing) {
      const parent = listing.closest(".listings");
      if (!parent) return;
      const items = Array.from(parent.children);
      const index = items.indexOf(listing);

      if (isUp && index > 0) parent.insertBefore(listing, items[index - 1]);
      if (isDown && index < items.length - 1)
        parent.insertBefore(items[index + 1], listing);

      if (window.__stages_dynamic) window.__stages_dynamic.reindexAll();
      updateArrowColors();
      return;
    }

    // 2) CATEGORY movement
    const category = findParent(btn, "category");
    if (category) {
      const parent = category.closest(".categories");
      if (!parent) return;
      const items = Array.from(parent.children);
      const index = items.indexOf(category);

      if (isUp && index > 0) parent.insertBefore(category, items[index - 1]);
      if (isDown && index < items.length - 1)
        parent.insertBefore(items[index + 1], category);

      if (window.__stages_dynamic) window.__stages_dynamic.reindexAll();
      updateArrowColors();
      return;
    }

    // 3) STAGE movement
    const stage = findParent(btn, "stage");
    if (stage) {
      const parent = wrapper;
      if (!parent) return;
      const items = Array.from(parent.children);
      const index = items.indexOf(stage);

      if (isUp && index > 0) parent.insertBefore(stage, items[index - 1]);
      if (isDown && index < items.length - 1)
        parent.insertBefore(items[index + 1], stage);

      if (window.__stages_dynamic) window.__stages_dynamic.reindexAll();
      updateArrowColors();
      return;
    }
  });

  // ==============================
  // Improved ARROW COLOR UPDATE
  // ==============================

  function updateArrowColors() {
    const BLUE = "#465FFF";
    const GREY = "#AEAEB2";

    // helper to set stroke color on svg/paths inside a span
    function setSpanColor(span, color) {
      if (!span) return;
      // set for <svg> stroke attribute if present
      const svgs = span.querySelectorAll("svg");
      svgs.forEach((svg) => {
        // set stroke attr on svg (affects children if not overridden)
        svg.setAttribute("stroke", color);
        // also set stroke on all path elements (explicit)
        svg
          .querySelectorAll("path, circle, line, polyline, polygon")
          .forEach((p) => {
            p.setAttribute("stroke", color);
          });
      });
      // if the span directly contains an svg without deeper selectors, above covers it
      // fallback: set color style (in case svg uses currentColor)
      span.style.color = color;
    }

    // STAGES: top-level children of #stages-wrapper
    const stageWrapper = document.querySelector("#stages-wrapper");
    if (stageWrapper) {
      const stages = Array.from(
        stageWrapper.querySelectorAll(":scope > .stage")
      );
      stages.forEach((st, idx) => {
        const upSpan = st.querySelector("span[title='Up']");
        const downSpan = st.querySelector("span[title='Down']");
        if (stages.length === 1) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, GREY);
        } else if (idx === 0) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, BLUE);
        } else if (idx === stages.length - 1) {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, GREY);
        } else {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, BLUE);
        }
      });
    }

    // CATEGORIES: per each stage, inspect direct children of .categories
    const allStages = document.querySelectorAll(".stage");
    allStages.forEach((st) => {
      const catsContainer = st.querySelector(".categories");
      if (!catsContainer) return;
      const cats = Array.from(
        catsContainer.querySelectorAll(":scope > .category")
      );
      cats.forEach((cat, idx) => {
        const upSpan = cat.querySelector("span[title='Up']");
        const downSpan = cat.querySelector("span[title='Down']");
        if (cats.length === 1) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, GREY);
        } else if (idx === 0) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, BLUE);
        } else if (idx === cats.length - 1) {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, GREY);
        } else {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, BLUE);
        }
      });
    });

    // LISTINGS: per each category, inspect direct children of .listings
    const allCats = document.querySelectorAll(".category");
    allCats.forEach((cat) => {
      const listsContainer = cat.querySelector(".listings");
      if (!listsContainer) return;
      const lists = Array.from(
        listsContainer.querySelectorAll(":scope > .listing")
      );
      lists.forEach((li, idx) => {
        const upSpan = li.querySelector("span[title='Up']");
        const downSpan = li.querySelector("span[title='Down']");
        if (lists.length === 1) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, GREY);
        } else if (idx === 0) {
          setSpanColor(upSpan, GREY);
          setSpanColor(downSpan, BLUE);
        } else if (idx === lists.length - 1) {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, GREY);
        } else {
          setSpanColor(upSpan, BLUE);
          setSpanColor(downSpan, BLUE);
        }
      });
    });
  }

  // run once on load
  document.addEventListener("DOMContentLoaded", updateArrowColors);

  // also expose for manual calls
  window.__stages_movement = { updateArrowColors };
</script>
